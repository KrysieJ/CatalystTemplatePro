# CatalystTemplatePro platform list.
#
# Hardware levels follow Catalyst Center:
#   family   - the broad device type, such as Switches and Hubs
#   series   - such as Catalyst 9300 Series
#   platform - a product ID (PID), such as C9300-48P
# Each series also records:
#   image     - the software image file family it runs, such as cat9k_iosxe
#   reference - the Cisco command reference it follows (series can share one)
#   default_role and default_role_source - Cisco's usual Catalyst Center role
#               for the series, as a starting suggestion
# Images list the variants they come in, such as npe (No Payload Encryption).
#
# Anything not yet known is left out, never guessed. The program reports a
# missing value as unknown. See docs/DESIGN-DECISIONS.md, D8, D20 and D24.
#
# Series names here are plain labels. The exact strings Catalyst Center
# uses have not been checked.
#
# This file is public. Do not add anything about a real network: no
# versions in service, inventory, or site details.
#
# Rules the program checks when it loads this file (it refuses the whole
# file if any fail):
#   - every id, name and PID is unique and not empty
#   - every reference to a source, family, variant, image, command
#     reference or series points at an entry that exists in this file
#   - a default_role always comes with a default_role_source
#   - every date is real and written as YYYY-MM-DD
#   - no field is misspelled or unknown

schema_version = 1

# ---------------------------------------------------------------- sources

[[source]]
id = "cisco-iosxe26-release-notes"
kind = "release-notes"
title = "Cisco IOS XE 26 release notes list"
location = "https://www.cisco.com/c/en/us/support/ios-nx-os-software/ios-xe-26/products-release-notes-list.html"
retrieved = "2026-11-08"

[[source]]
id = "cisco-iosxe26-documentation"
kind = "command-reference"
title = "Cisco IOS XE 26 documentation page, which lists per-platform command references"
location = "https://www.cisco.com/c/en/us/support/ios-nx-os-software/ios-xe-26-1-1/model.html"
retrieved = "2026-11-08"

[[source]]
id = "engineer-catalyst-center-levels"
kind = "engineer-statement"
title = "Catalyst Center organizes devices as Family > Series > Platform, for example Switches and Hubs > Catalyst 9300 Series > C9300-48P"
retrieved = "2026-11-08"

[[source]]
id = "engineer-default-roles"
kind = "engineer-statement"
title = "Cisco's usual Catalyst Center role by series: 9200, 9200CX, 9300 and 9400 are Access; 9500 is Distribution; 9600 is Core; xx50 and xx10 series take their parent's role; 91xx access points are Access"
retrieved = "2026-11-08"

[[source]]
id = "engineer-newer-c9k-models"
kind = "engineer-statement"
title = "C9350, C9550 and C9610 run the same image as the matching 00 series, with extra features such as power management; the command references are the same"
retrieved = "2026-11-08"

[[source]]
id = "engineer-images"
kind = "engineer-statement"
title = "Image families from installing firmware: cat9k_iosxe for C9300, C9350, C9400, C9500, C9550, C9600 and C9610; cat9k_lite_iosxe for C9200 and C9200CX; C9800-universalk9 for the C9800, with C91xx AP images packaged inside it; cat3k_caa-universalk9 for C3650 and C3850; ie3x00-universalk9 for IE3400 and IE3500. Commands can differ by model where a feature exists on some models only."
retrieved = "2026-11-08"

[[source]]
id = "engineer-router-images"
kind = "engineer-statement"
title = "Router image families from installing firmware: c8000be-universalk9 (also as _npe) for the Catalyst 8300 Edge Platform; c8kg2be-universalk9 for the Catalyst 8300 and 8200 Secure Router Gen2; c8000aep-universalk9 (also as _npe, _noli and _npe_noli) for the Catalyst 8500 Edge Platform and 8500 Secure Router Gen2; c8000aes-universalk9 for the Catalyst 8500L Edge Platform; ir1800-universalk9 for the IR1833 and IR1835. File names follow <image>[_variant].<MM>.<mm>.<rr>.SPA.bin."
retrieved = "2026-11-08"

[[source]]
id = "engineer-c9200cx"
kind = "engineer-statement"
title = "The C9200CX uses the C9200 command reference, but its feature set may be limited; its data sheet is the place to check features"
retrieved = "2026-11-08"

[[source]]
id = "engineer-ie3x00"
kind = "engineer-statement"
title = "The IE3500 runs the same IE3x00 image as the IE3400; x is a wildcard in the image name"
retrieved = "2026-11-08"

[[source]]
id = "engineer-ir1800"
kind = "engineer-statement"
title = "The IR1833 and IR1835 use the same image and command reference; they differ by an I/O header"
retrieved = "2026-11-08"

[[source]]
id = "engineer-c9800-40"
kind = "engineer-statement"
title = "The C9800-40 is a Catalyst 9800 wireless controller"
retrieved = "2026-11-08"

