# CatalystTemplatePro platform list.
#
# Three levels, from the software you install down to the hardware:
#   image  - the software image file family, such as cat9k_iosxe
#   family - models that share one Cisco command reference
#   model  - one hardware model or series
# Families point at the image they run (left out when not yet known).
# Models point at a family and at the source that says they belong there.
# Features can still differ by model within one image; those differences
# become callouts in the command catalog. See docs/DESIGN-DECISIONS.md,
# D8 and D20.
#
# Rules the program checks when it loads this file (it refuses the whole
# file if any fail):
#   - every image name, id and model name is unique and not empty
#   - every image's source exists below
#   - every family's image exists below
#   - every model's family exists below
#   - every model's source exists below
#   - every date is real and written as YYYY-MM-DD
#   - no field is misspelled or unknown
#
# To add a device that runs a family's image, add a [[model]] entry and,
# if needed, a [[source]] entry that backs it. No code change is needed.

schema_version = 1

# ---------------------------------------------------------------- sources

[[source]]
id = "cisco-iosxe26-release-notes"
kind = "release-notes"
title = "Cisco IOS XE 26 release notes list"
location = "https://www.cisco.com/c/en/us/support/ios-nx-os-software/ios-xe-26/products-release-notes-list.html"
retrieved = "2026-11-08"

[[source]]
id = "engineer-newer-c9k-models"
kind = "engineer-statement"
title = "C9350, C9550 and C9610 run the same image as the matching 00 models, with extra features such as power management; the command references are the same"
retrieved = "2026-11-08"

[[source]]
id = "engineer-ie3x00"
kind = "engineer-statement"
title = "The IE3500 runs the same IE3x00 image as the IE3400; x is a wildcard in the image name"
retrieved = "2026-11-08"

[[source]]
id = "engineer-ir1800"
kind = "engineer-statement"
title = "The IR1833 and IR1835 use the same image and command reference; they differ by an I/O header"
retrieved = "2026-11-08"

[[source]]
id = "engineer-c9800-40"
kind = "engineer-statement"
title = "A C9800-40 wireless controller is in service on IOS XE 26.1.2"
retrieved = "2026-11-08"

[[source]]
id = "engineer-images"
kind = "engineer-statement"
title = "Image families from installing firmware: cat9k_iosxe for C9300, C9350, C9400, C9500, C9550, C9600 and C9610; cat9k_lite_iosxe for C9200 and C9200CX; C9800-universalk9 for the C9800, with C91xx AP images packaged inside it; cat3k_caa-universalk9 for C3650 and C3850; ie3x00-universalk9 for IE3400 and IE3500. Commands can differ by model where a feature exists on some models only."
retrieved = "2026-11-08"

